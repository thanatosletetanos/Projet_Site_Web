<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Hot Wheels Collection - Contact</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <div class="logo">
        <h1>Hot Wheels Collection</h1>
    </div>
    <nav>
        <ul class="nav-links">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="collection.html">Collection</a></li>
            <li><a href="favorites.html">Mes modèles favoris</a></li>
            <li><a href="about.html">À propos</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>
</header>

<main>
    <div class="content-box">
        <section>
            <h2>Me contacter</h2>
            <p>Vous êtes collectionneur aussi ? Envoyez-moi un message :</p>

            <form class="contact-form">
                <div class="form-group">
                    <label for="nom">Nom complet</label>
                    <input type="text" id="nom" name="nom" placeholder="Votre nom" required>
                </div>

                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email" placeholder="vous@example.com" required>
                </div>

                <div class="form-group">
                    <label for="type-collection">Type de collection</label>
                    <select id="type-collection" name="type-collection">
                        <option value="premium">Premium</option>
                        <option value="mainline">Mainline</option>
                        <option value="mixte">Mixte</option>
                    </select>
                </div>

                <fieldset class="form-group">
                    <legend>Êtes-vous ouvert aux échanges ?</legend>
                    <label>
                        <input type="radio" name="echange" value="oui" checked>
                        Oui
                    </label>
                    <label>
                        <input type="radio" name="echange" value="non">
                        Non
                    </label>
                </fieldset>

                <div class="form-group">
                    <label>
                        <input type="checkbox" name="newsletter">
                        Je souhaite recevoir des nouvelles de ta collection
                    </label>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Votre message..." required></textarea>
                </div>

                <button type="submit">Envoyer</button>
            </form>
        </section>
    </div>
</main>

<footer>
    <p>&copy; 2025 - Ma collection Hot Wheels</p>
</footer>
</body>
</html>
